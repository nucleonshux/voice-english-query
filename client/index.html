<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>语音英语查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f4f7fb;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .container {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 24px;
    position: relative;
  }

  /* 顶部标题 */
  .header { text-align: center; margin-bottom: 16px; }
  .header h1 {
    font-size: 28px; font-weight: 800; color: #1e3a5f;
    letter-spacing: 1px;
  }
  .header p { font-size: 14px; color: #7a8fa6; margin-top: 6px; }

  /* 语言切换 */
  .lang-switch {
    display: flex; gap: 8px; margin-bottom: 18px;
    background: #e6ebf2; border-radius: 22px; padding: 4px;
  }
  .lang-switch button {
    border: none; background: transparent; color: #5b6b7d;
    font-size: 14px; font-weight: 600; padding: 7px 16px;
    border-radius: 18px; cursor: pointer; transition: background .15s, color .15s;
  }
  .lang-switch button.active { background: #ffffff; color: #2563eb; box-shadow: 0 1px 4px rgba(30,60,120,.14); }

  /* 结果区 */
  .result-area {
    width: 100%;
    min-height: 200px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;
    margin-bottom: 20px;
  }
  .placeholder { color: #9aaabf; font-size: 16px; text-align: center; line-height: 1.7; }
  .result { width: 100%; text-align: center; display: none; }
  .result .word {
    font-size: 58px; font-weight: 800; color: #1e3a5f;
    letter-spacing: 1px; cursor: pointer; line-height: 1.2;
    word-break: break-all;
  }
  .result .hint-tap { font-size: 13px; color: #9aaabf; margin-top: 6px; }
  .result .meaning {
    font-size: 16px; color: #5b6b7d; margin-top: 12px; line-height: 1.6;
    max-height: 76px; overflow-y: auto;
  }
  .result .spell-row { margin-top: 14px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .result .spell-row .letter {
    width: 44px; height: 44px; line-height: 44px; text-align: center;
    background: #eef4ff; color: #2563eb; border-radius: 10px;
    font-size: 22px; font-weight: 700; transition: background .15s, color .15s, transform .15s;
  }
  .result .spell-row .letter.active { background: #2563eb; color: #fff; transform: scale(1.12); }

  /* 圆形按钮（扁平） */
  .btn-wrap { position: relative; display: flex; justify-content: center; margin-bottom: 18px; }
  .pulse-ring {
    position: absolute; top: 50%; left: 50%;
    width: 160px; height: 160px; border-radius: 50%;
    border: 3px solid #93b9f6;
    transform: translate(-50%,-50%);
    opacity: 0; pointer-events: none;
  }
  .pulse-ring.anim { animation: pulse 1.2s ease-out infinite; }
  @keyframes pulse {
    0% { transform: translate(-50%,-50%) scale(0.92); opacity: .8; }
    100% { transform: translate(-50%,-50%) scale(1.5); opacity: 0; }
  }
  .mic-btn {
    width: 160px; height: 160px; border-radius: 50%;
    background: #2563eb;
    border: none; cursor: pointer; outline: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; transition: background .15s, transform .12s;
  }
  .mic-btn:active { transform: scale(.96); }
  .mic-btn .mic-icon { font-size: 44px; line-height: 1; }
  .mic-btn .mic-text { font-size: 15px; font-weight: 700; margin-top: 8px; letter-spacing: 2px; }
  .mic-btn.recording { background: #ef4444; }

  /* 状态提示 */
  .status { min-height: 24px; font-size: 15px; color: #4b5c6f; font-weight: 600; margin-bottom: 10px; text-align: center; }

  /* 键盘输入（降级模式） */
  .input-mode { width: 100%; display: none; margin-bottom: 16px; }
  .input-mode.show { display: block; }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; height: 48px; border-radius: 12px; border: 1.5px solid #d3dce8;
    background: #fff; padding: 0 14px; font-size: 16px; color: #1e293b;
    outline: none;
  }
  .input-row input:focus { border-color: #2563eb; }
  .input-row button {
    height: 48px; padding: 0 20px; border-radius: 12px; border: none;
    background: #2563eb; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .mode-switch { font-size: 13px; color: #5b8dd9; text-decoration: underline; cursor: pointer; margin-bottom: 16px; }

  /* 底部说明 */
  .footer { margin-top: auto; font-size: 12px; color: #a5b4c6; text-align: center; line-height: 1.7; }

  /* 错误提示 */
  .error-box {
    background: #fdeceb; color: #c0392b; border-radius: 12px; padding: 10px 14px;
    font-size: 14px; margin-bottom: 12px; display: none; width: 100%;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔊 语音英语查询</h1>
    <p>点一下开始听，再说中文或英文</p>
  </div>

  <div class="lang-switch" id="langSwitch">
    <button data-lang="auto" class="active">自动</button>
    <button data-lang="zh">中文</button>
    <button data-lang="en">English</button>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result-area" id="resultArea">
    <div class="placeholder" id="placeholder">👇 点一下按钮开始听<br>说完再点一下开始识别</div>
    <div class="result" id="result">
      <div class="word" id="word"></div>
      <div class="hint-tap">👆 点击单词 重复读拼写</div>
      <div class="meaning" id="meaning"></div>
      <div class="spell-row" id="spellRow"></div>
    </div>
  </div>

  <div class="status" id="status">点一下开始听，再点一下识别</div>

  <div class="mode-switch" id="modeSwitch">麦克风不可用？点这里用键盘输入</div>

  <div class="input-mode" id="inputMode">
    <div class="input-row">
      <input id="textInput" type="text" placeholder="输入中文或英文单词" enterkeyhint="search">
      <button id="textBtn">查询</button>
    </div>
  </div>

  <div class="btn-wrap">
    <div class="pulse-ring" id="pulseRing"></div>
    <button class="mic-btn" id="micBtn">
      <span class="mic-icon" id="micIcon">🎤</span>
      <span class="mic-text" id="micText">开始听</span>
    </button>
  </div>

  <div class="footer">词库来源：有道词典<br>首次使用请允许麦克风权限</div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var placeholder = $('placeholder'), resultEl = $('result');
  var wordEl = $('word'), meaningEl = $('meaning'), spellRow = $('spellRow');
  var micBtn = $('micBtn'), micIcon = $('micIcon'), micText = $('micText');
  var statusEl = $('status'), pulseRing = $('pulseRing'), errorBox = $('errorBox');
  var modeSwitch = $('modeSwitch'), inputMode = $('inputMode'), textInput = $('textInput'), textBtn = $('textBtn');

  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var useVoice = !!SpeechRecognition;
  var currentResult = null;
  var recognizing = false;
  var recog = null;
  var recogLang = 'zh-CN';
  var langMode = 'auto';   // auto | zh | en
  var speechSupported = 'speechSynthesis' in window;
  var jsonpSeq = 0;
  var spellTimers = [];
  var spellSpeaking = false;

  // ---------- 界面状态 ----------
  function showError(msg) {
    if (!msg) { errorBox.style.display = 'none'; return; }
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }
  function setStatus(t) { statusEl.textContent = t; }

  // ---------- 有道 suggest JSONP 查询 ----------
  function youdaoSuggest(q) {
    return new Promise(function (resolve, reject) {
      var cb = 'ydcb_' + (++jsonpSeq);
      var script = document.createElement('script');
      var timer = setTimeout(function () { cleanup(); reject(new Error('timeout')); }, 12000);
      function cleanup() {
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[cb] = function (data) {
        cleanup();
        var entries = (data && data.data && data.data.entries) || [];
        resolve(entries);
      };
      script.src = 'https://dict.youdao.com/suggest?num=5&doctype=json&q=' +
        encodeURIComponent(q) + '&callback=' + cb;
      script.onerror = function () { cleanup(); reject(new Error('network')); };
      document.body.appendChild(script);
    });
  }

  // 有道单词发音（美音 mp3）
  function playYoudaoVoice(word) {
    var a = document.createElement('audio');
    a.src = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=2';
    a.play().catch(function () { /* 自动播放被拦时静默 */ });
  }

  // ---------- 语音合成 ----------
  function pickVoice(langPrefix) {
    if (!speechSupported) return null;
    var voices = window.speechSynthesis.getVoices();
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(langPrefix) === 0) return voices[i];
    }
    return null;
  }

  // 逐字母拼读：单个 utterance 一次读完整拼写（"A P P L E"），
  // 避免连续 speak 被浏览器互相覆盖导致无声；高亮动画独立并行。
  function animateSpelling(word) {
    var letters = spellRow.children;
    var total = word.length;
    clearSpell();
    spellSpeaking = true;
    if (speechSupported) window.speechSynthesis.cancel();

    // 高亮动画（不依赖语音回调，保证一定有动画）
    var i = 0;
    function hl() {
      if (!spellSpeaking) return;
      for (var k = 0; k < letters.length; k++) letters[k].classList.remove('active');
      if (letters[i]) letters[i].classList.add('active');
      i++;
      if (i < total) {
        spellTimers.push(setTimeout(hl, 680));
      } else {
        spellTimers.push(setTimeout(function () {
          for (var k = 0; k < letters.length; k++) letters[k].classList.remove('active');
          spellSpeaking = false;
        }, 600));
      }
    }
    spellTimers.push(setTimeout(hl, 350));

    // 语音：单个 utterance 读字母串（空格分隔），优先英文语音，降级任意语音
    if (speechSupported) {
      var u = new SpeechSynthesisUtterance(word.split('').join(' '));
      u.lang = 'en-US';
      u.rate = 0.72;
      u.pitch = 1.1;
      var enVoice = pickVoice('en');
      if (enVoice) {
        u.voice = enVoice;
      } else {
        // 无英文语音时用任意可用语音兜底，保证有声音
        var voices = window.speechSynthesis.getVoices();
        if (voices && voices.length) u.voice = voices[0];
      }
      try { window.speechSynthesis.speak(u); } catch (e) { /* ignore */ }
    }
  }

  function clearSpell() {
    spellSpeaking = false;
    for (var k = 0; k < spellTimers.length; k++) clearTimeout(spellTimers[k]);
    spellTimers = [];
    if (speechSupported) window.speechSynthesis.cancel();
  }

  // ---------- 渲染结果 ----------
  function renderResult(data) {
    currentResult = data;
    placeholder.style.display = 'none';
    resultEl.style.display = 'block';
    // 单词太长自动缩小字号，避免换行
    var len = data.word.length;
    wordEl.style.fontSize = (len > 10 ? 40 : len > 7 ? 48 : 58) + 'px';
    wordEl.textContent = data.word;
    meaningEl.textContent = data.meaning || '';
    spellRow.innerHTML = '';
    data.spelling.forEach(function (ch) {
      var d = document.createElement('div');
      d.className = 'letter';
      d.textContent = ch.toUpperCase();
      spellRow.appendChild(d);
    });
    showError('');
    setStatus('已找到：' + data.word + '，正在朗读…');
    playYoudaoVoice(data.word);
    setTimeout(function () { animateSpelling(data.word); }, data.word.length > 6 ? 1800 : 1400);
  }

  // ---------- 查询（中→英 / 英→中） ----------
  function isChinese(s) { return /[\u4e00-\u9fa5]/.test(s); }

  function doQuery(q) {
    q = (q || '').trim();
    if (!q) { setStatus('请输入要查询的词语'); return; }
    setStatus('正在查询：' + q + ' …');
    showError('');

    var finish = function (result) { renderResult(result); };
    var fail = function (msg) {
      placeholder.style.display = 'block';
      resultEl.style.display = 'none';
      setStatus('没有找到结果');
      showError(msg || '查询失败，请换个词试试');
    };

    if (isChinese(q)) {
      youdaoSuggest(q).then(function (entries) {
        var en = null;
        for (var i = 0; i < entries.length; i++) {
          var e = entries[i].explain;
          if (typeof e === 'string' && /^[a-zA-Z][a-zA-Z\s'-]*$/.test(e.trim())) {
            en = e.trim().split(/\s+/)[0].toLowerCase();
            break;
          }
        }
        if (!en) { fail('没有找到该词对应的英文'); return; }
        youdaoSuggest(en).then(function (enEntries) {
          var meaning = '';
          if (enEntries && enEntries.length) meaning = enEntries[0].explain || '';
          finish({ query: q, lang: 'zh', word: en, meaning: meaning, spelling: en.split('') });
        }).catch(function () {
          finish({ query: q, lang: 'zh', word: en, meaning: '', spelling: en.split('') });
        });
      }).catch(function () { fail('网络异常，请检查网络后重试'); });
    } else {
      youdaoSuggest(q).then(function (entries) {
        if (!entries || !entries.length) { fail('没有找到该单词'); return; }
        var en = entries[0].entry;
        var meaning = entries[0].explain || '';
        finish({ query: q, lang: 'en', word: en, meaning: meaning, spelling: en.split('') });
      }).catch(function () { fail('网络异常，请检查网络后重试'); });
    }
  }

  // ---------- 语音识别（点击开始/停止） ----------
  function currentLang() {
    if (langMode === 'zh') return 'zh-CN';
    if (langMode === 'en') return 'en-US';
    return 'zh-CN'; // auto 默认先中文
  }

  function createRecog(lang) {
    var r = new SpeechRecognition();
    r.lang = lang;
    r.interimResults = true;
    r.continuous = false;
    r.maxAlternatives = 1;
    r.onresult = function (ev) {
      var interim = '', final = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var tr = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) final += tr;
        else interim += tr;
      }
      if (interim) {
        setStatus('正在听：' + interim);
        // 自动模式下根据 interim 智能切换语言
        if (langMode === 'auto') {
          if (recogLang === 'zh-CN' && !/[\u4e00-\u9fa5]/.test(interim) && /[a-zA-Z]/.test(interim)) {
            switchTo('en-US');
          } else if (recogLang === 'en-US' && /[\u4e00-\u9fa5]/.test(interim)) {
            switchTo('zh-CN');
          }
        }
      }
      if (final) {
        setStatus('识别到：' + final);
        doQuery(final);
      }
    };
    r.onerror = function (ev) {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        recognizing = false;
        micBtn.classList.remove('recording');
        pulseRing.classList.remove('anim');
        setStatus('麦克风不可用');
        showError('无法使用麦克风（可能被浏览器禁止），已切换到键盘输入模式');
        inputMode.classList.add('show');
        modeSwitch.style.display = 'none';
      } else if (ev.error === 'no-speech') {
        setStatus('没有听到声音，请点一下再试');
      } else if (ev.error === 'aborted') {
        // 用户再次点击停止
      } else {
        setStatus('识别出错：' + ev.error);
      }
    };
    r.onend = function () {
      recognizing = false;
      micBtn.classList.remove('recording');
      micText.textContent = '开始听';
      micIcon.textContent = '🎤';
      pulseRing.classList.remove('anim');
      if (!currentResult) setStatus('点一下开始听，再点一下识别');
    };
    return r;
  }

  function startRecog() {
    if (!useVoice) return;
    if (recognizing) return;
    recognizing = true;
    recogLang = currentLang();
    recog = createRecog(recogLang);
    micBtn.classList.add('recording');
    micIcon.textContent = '🎙️';
    micText.textContent = '正在听…';
    pulseRing.classList.add('anim');
    setStatus('正在听，请说出' + (recogLang === 'zh-CN' ? '中文或英文' : '英文单词') + '…');
    try { recog.start(); } catch (e) { recognizing = false; }
  }

  function stopRecog() {
    if (!useVoice || !recognizing) return;
    try { recog.stop(); } catch (e) { /* ignore */ }
  }

  function switchTo(lang) {
    if (recogLang === lang) return;
    recogLang = lang;
    try { recog.stop(); } catch (e) { /* ignore */ }
    recognizing = false;
    setTimeout(function () {
      if (!recognizing && langMode === 'auto') {
        recognizing = true;
        recog = createRecog(lang);
        try { recog.start(); } catch (e) { recognizing = false; }
      }
    }, 150);
  }

  // ---------- 按钮事件：点一下开始听，再点一下开始识别 ----------
  function toggleRecog() {
    if (recognizing) stopRecog();
    else startRecog();
  }
  micBtn.addEventListener('click', toggleRecog);

  // 语言切换
  var langBtns = document.querySelectorAll('#langSwitch button');
  langBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      langMode = btn.getAttribute('data-lang');
      langBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      if (langMode === 'en') setStatus('English 模式：点一下开始听，再说英文');
      else if (langMode === 'zh') setStatus('中文模式：点一下开始听，再说中文');
      else setStatus('自动模式：点一下开始听，中文英文都能识别');
    });
  });

  // 点击单词 → 重复读拼写
  wordEl.addEventListener('click', function () {
    if (currentResult) {
      setStatus('重复朗读拼写：' + currentResult.word);
      animateSpelling(currentResult.word);
    }
  });

  // ---------- 输入模式切换 ----------
  var inputModeOn = false;
  modeSwitch.addEventListener('click', function () {
    inputModeOn = !inputModeOn;
    inputMode.classList.toggle('show', inputModeOn);
    modeSwitch.textContent = inputModeOn ? '← 返回点击说话' : '麦克风不可用？点这里用键盘输入';
  });
  textBtn.addEventListener('click', function () { doQuery(textInput.value); });
  textInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doQuery(textInput.value);
  });

  // 预加载语音
  if (speechSupported) {
    window.speechSynthesis.getVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = function () { window.speechSynthesis.getVoices(); };
    }
  }
  if (!useVoice) {
    setStatus('当前浏览器不支持语音识别，请用键盘输入');
    inputMode.classList.add('show');
    modeSwitch.style.display = 'none';
  }
})();
</script>
</body>
</html>

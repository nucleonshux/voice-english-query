<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>语音英语查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f4f7fb;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .container {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 24px;
    position: relative;
  }

  /* 顶部标题 */
  .header { text-align: center; margin-bottom: 16px; }
  .header h1 {
    font-size: 28px; font-weight: 800; color: #1e3a5f;
    letter-spacing: 1px;
  }
  .header p { font-size: 14px; color: #7a8fa6; margin-top: 6px; }

  /* 语言切换 */
  .lang-switch {
    display: flex; gap: 8px; margin-bottom: 18px;
    background: #e6ebf2; border-radius: 22px; padding: 4px;
  }
  .lang-switch button {
    border: none; background: transparent; color: #5b6b7d;
    font-size: 14px; font-weight: 600; padding: 7px 16px;
    border-radius: 18px; cursor: pointer; transition: background .15s, color .15s;
  }
  .lang-switch button.active { background: #ffffff; color: #2563eb; box-shadow: 0 1px 4px rgba(30,60,120,.14); }

  /* 结果区 */
  .result-area {
    width: 100%;
    min-height: 200px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;
    margin-bottom: 20px;
  }
  .placeholder { color: #9aaabf; font-size: 16px; text-align: center; line-height: 1.7; }
  .result { width: 100%; text-align: center; display: none; }
  .result .word {
    font-size: 58px; font-weight: 800; color: #1e3a5f;
    letter-spacing: 1px; cursor: pointer; line-height: 1.2;
    word-break: break-all;
  }
  .result .hint-tap { font-size: 13px; color: #9aaabf; margin-top: 6px; }
  .result .meaning {
    font-size: 16px; color: #5b6b7d; margin-top: 12px; line-height: 1.6;
    max-height: 76px; overflow-y: auto;
  }
  .result .spell-row { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; }
  .result .spell-row .letter {
    width: 26px; height: 26px; line-height: 26px; text-align: center;
    background: #eef4ff; color: #2563eb; border-radius: 6px;
    font-size: 14px; font-weight: 700;
  }
  .result .spell-row .letter.active { background: #2563eb; color: #fff; }
  .result .candidates {
    margin-top: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  }
  .result .candidates .cand {
    border: 1.5px solid #d3dce8; background: #f6f9fd; color: #2563eb;
    font-size: 14px; font-weight: 600; padding: 5px 12px; border-radius: 16px;
    cursor: pointer;
  }
  .result .candidates .cand:active { background: #2563eb; color: #fff; }

  /* 圆形按钮（扁平） */
  .btn-wrap { position: relative; display: flex; justify-content: center; margin-bottom: 18px; }
  .pulse-ring {
    position: absolute; top: 50%; left: 50%;
    width: 128px; height: 128px; border-radius: 50%;
    border: 3px solid #93b9f6;
    transform: translate(-50%,-50%);
    opacity: 0; pointer-events: none;
  }
  .pulse-ring.anim { animation: pulse 1.2s ease-out infinite; }
  @keyframes pulse {
    0% { transform: translate(-50%,-50%) scale(0.92); opacity: .8; }
    100% { transform: translate(-50%,-50%) scale(1.5); opacity: 0; }
  }
  .mic-btn {
    width: 128px; height: 128px; border-radius: 50%;
    background: #2563eb;
    border: none; cursor: pointer; outline: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; transition: background .15s, transform .12s;
  }
  .mic-btn:active { transform: scale(.96); }
  .mic-btn .mic-icon { font-size: 34px; line-height: 1; }
  .mic-btn .mic-text { font-size: 13px; font-weight: 700; margin-top: 6px; letter-spacing: 2px; }
  .mic-btn.recording { background: #ef4444; }

  /* 状态提示 */
  .status { min-height: 24px; font-size: 15px; color: #4b5c6f; font-weight: 600; margin-bottom: 10px; text-align: center; }

  /* 键盘输入（降级模式） */
  .input-mode { width: 100%; display: none; margin-bottom: 16px; }
  .input-mode.show { display: block; }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; height: 48px; border-radius: 12px; border: 1.5px solid #d3dce8;
    background: #fff; padding: 0 14px; font-size: 16px; color: #1e293b;
    outline: none;
  }
  .input-row input:focus { border-color: #2563eb; }
  .input-row button {
    height: 48px; padding: 0 20px; border-radius: 12px; border: none;
    background: #2563eb; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .mode-switch { font-size: 13px; color: #5b8dd9; text-decoration: underline; cursor: pointer; margin-bottom: 16px; }

  /* 底部说明 */
  .footer { margin-top: auto; font-size: 12px; color: #a5b4c6; text-align: center; line-height: 1.7; }

  /* 错误提示 */
  .error-box {
    background: #fdeceb; color: #c0392b; border-radius: 12px; padding: 10px 14px;
    font-size: 14px; margin-bottom: 12px; display: none; width: 100%;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔊 语音英语查询</h1>
    <p>点一下开始听，再说中文或英文</p>
  </div>

  <div class="lang-switch" id="langSwitch">
    <button data-lang="zh" class="active">中文</button>
    <button data-lang="en">English</button>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result-area" id="resultArea">
    <div class="placeholder" id="placeholder">👇 点一下按钮开始听<br>说完再点一下开始识别</div>
    <div class="result" id="result">
      <div class="word" id="word"></div>
      <div class="hint-tap">👆 点击单词 重复朗读</div>
      <div class="meaning" id="meaning"></div>
      <div class="spell-row" id="spellRow"></div>
      <div class="candidates" id="candidates"></div>
    </div>
  </div>

  <div class="status" id="status">点一下开始听，再点一下识别</div>

  <div class="mode-switch" id="modeSwitch">麦克风不可用？点这里用键盘输入</div>

  <div class="input-mode" id="inputMode">
    <div class="input-row">
      <input id="textInput" type="text" placeholder="输入中文或英文单词" enterkeyhint="search">
      <button id="textBtn">查询</button>
    </div>
  </div>

  <div class="btn-wrap">
    <div class="pulse-ring" id="pulseRing"></div>
    <button class="mic-btn" id="micBtn">
      <span class="mic-icon" id="micIcon">🎤</span>
      <span class="mic-text" id="micText">开始听</span>
    </button>
  </div>

  <div class="footer">词库来源：有道词典<br>首次使用请允许麦克风权限</div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var placeholder = $('placeholder'), resultEl = $('result');
  var wordEl = $('word'), meaningEl = $('meaning'), spellRow = $('spellRow'), candidatesEl = $('candidates');
  var micBtn = $('micBtn'), micIcon = $('micIcon'), micText = $('micText');
  var statusEl = $('status'), pulseRing = $('pulseRing'), errorBox = $('errorBox');
  var modeSwitch = $('modeSwitch'), inputMode = $('inputMode'), textInput = $('textInput'), textBtn = $('textBtn');

  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var useVoice = !!SpeechRecognition;
  var currentResult = null;
  var recognizing = false;
  var recog = null;
  var recogLang = 'zh-CN';
  var langMode = 'zh';   // zh | en
  var jsonpSeq = 0;
  var spellSpeaking = false;
  var spellAudios = [];    // 当前拼读用到的 audio 元素
  var audioPool = [];      // 本次页面内创建过的所有 audio 元素（统一释放通道）
  var lastMicEnd = 0;      // 上次识别会话结束时间戳（启动冷却用）

  // ---------- 界面状态 ----------
  function showError(msg) {
    if (!msg) { errorBox.style.display = 'none'; return; }
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }
  function setStatus(t) { statusEl.textContent = t; }

  // ---------- 有道 suggest JSONP 查询 ----------
  function youdaoSuggest(q) {
    return new Promise(function (resolve, reject) {
      var cb = 'ydcb_' + (++jsonpSeq);
      var script = document.createElement('script');
      var timer = setTimeout(function () { cleanup(); reject(new Error('timeout')); }, 12000);
      function cleanup() {
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[cb] = function (data) {
        cleanup();
        var entries = (data && data.data && data.data.entries) || [];
        resolve(entries);
      };
      script.src = 'https://dict.youdao.com/suggest?num=5&doctype=json&q=' +
        encodeURIComponent(q) + '&callback=' + cb;
      script.onerror = function () { cleanup(); reject(new Error('network')); };
      document.body.appendChild(script);
    });
  }

  // 有道单词发音（美音 mp3）。播放完立即释放，避免占用识别音频通道。
  function playYoudaoVoice(word) {
    var a = document.createElement('audio');
    a.src = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=2';
    audioPool.push(a);
    a.onended = function () { releaseAudio(a); };
    a.onerror = function () { releaseAudio(a); };
    a.play().catch(function () { releaseAudio(a); /* 自动播放被拦时静默 */ });
  }

  // 停止并释放一个音频元素（清空 src，释放系统音频通道）
  function releaseAudio(a) {
    try { a.pause(); a.removeAttribute('src'); a.load(); } catch (e) { /* ignore */ }
    var i = audioPool.indexOf(a);
    if (i >= 0) audioPool.splice(i, 1);
  }

  // 停止当前所有音频（识别启动前调用，确保麦克风通道不被占用）
  function stopAllAudio() {
    for (var i = 0; i < audioPool.length; i++) {
      try {
        var a = audioPool[i];
        a.pause();
        a.removeAttribute('src');
        a.load();
      } catch (e) { /* ignore */ }
    }
    audioPool = [];
  }

  // iOS 自动播放解锁：必须在用户点击手势内首次播放音频，
  // 之后识别结果返回的自动朗读（单词音）才能正常出声。
  // 用一个超短静音音频在手势内“预热”播放通道。
  function unlockAutoplay() {
    var a = document.createElement('audio');
    a.preload = 'auto';
    // 100ms 静音 wav（base64），播放时无声音，仅用于解锁
    a.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
    a.volume = 0;
    audioPool.push(a);
    a.onended = function () { releaseAudio(a); };
    a.onerror = function () { releaseAudio(a); };
    a.play().catch(function () { releaseAudio(a); });
  }

  // ---------- 逐字母真人拼读 ----------
  // 像真人拼读一样：a---p---p---l---e，一个字母一个字母读、字母之间自然停顿。
  // 使用有道真人发音音频（支持单字母发音），完全绕开浏览器自带语音合成，
  // 避免 iOS 手势限制、连读、乱序等问题。
  function animateSpelling(word) {
    var letters = spellRow.children;
    var total = word.length;
    clearSpell();
    spellSpeaking = true;

    // 预先创建每个字母的音频并开始加载
    spellAudios = [];
    for (var i = 0; i < total; i++) {
      var a = document.createElement('audio');
      a.preload = 'auto';
      a.src = 'https://dict.youdao.com/dictvoice?audio=' +
        encodeURIComponent(word[i].toLowerCase()) + '&type=2';
      spellAudios.push(a);
      audioPool.push(a);
    }

    var idx = 0;
    var finished = false;
    function step() {
      if (!spellSpeaking || finished) return;
      if (idx >= total) {
        for (var k = 0; k < letters.length; k++) letters[k].classList.remove('active');
        spellSpeaking = false;
        return;
      }
      // 高亮当前字母
      for (var k = 0; k < letters.length; k++) letters[k].classList.remove('active');
      if (letters[idx]) letters[idx].classList.add('active');

      var p = spellAudios[idx];
      var guard = setTimeout(function () { next(); }, 2500); // 兜底：音频异常时也推进
      function next() {
        clearTimeout(guard);
        idx++;
        step();
      }
      p.onended = next;
      p.onerror = next;
      p.play().catch(function () { next(); });
    }
    step();
  }

  function clearSpell() {
    spellSpeaking = false;
    stopAllAudio();
  }

  // ---------- 渲染结果 ----------
  function renderResult(data) {
    currentResult = data;
    placeholder.style.display = 'none';
    resultEl.style.display = 'block';
    // 单词太长自动缩小字号，避免换行
    var len = data.word.length;
    wordEl.style.fontSize = (len > 10 ? 40 : len > 7 ? 48 : 58) + 'px';
    wordEl.textContent = data.word;
    meaningEl.textContent = data.meaning || '';
    spellRow.innerHTML = '';
    data.spelling.forEach(function (ch) {
      var d = document.createElement('div');
      d.className = 'letter';
      d.textContent = ch.toUpperCase();
      spellRow.appendChild(d);
    });
    showError('');
    setStatus('已找到：' + data.word + '，正在朗读…');
    // 只读单词（有道美音），拼写仅展示
    playYoudaoVoice(data.word);
    // 渲染候选词（识别/查询的模糊备选）
    candidatesEl.innerHTML = '';
    var cands = data.candidates || [];
    var shown = 0;
    for (var ci = 0; ci < cands.length && shown < 5; ci++) {
      var cw = cands[ci];
      if (!cw || cw === data.word || cw.indexOf(data.word) === 0) continue;
      (function (w) {
        var b = document.createElement('button');
        b.className = 'cand';
        b.textContent = w;
        b.onclick = function () { doQuery(w); };
        candidatesEl.appendChild(b);
        shown++;
      })(cw);
    }
    if (shown === 0) candidatesEl.style.display = 'none';
    else candidatesEl.style.display = 'flex';
  }

  // ---------- 查询（中→英 / 英→中） ----------
  function isChinese(s) { return /[\u4e00-\u9fa5]/.test(s); }

  function doQuery(q) {
    q = (q || '').trim();
    if (!q) { setStatus('请输入要查询的词语'); return; }
    setStatus('正在查询：' + q + ' …');
    showError('');

    var finish = function (result) { renderResult(result); };
    var fail = function (msg) {
      placeholder.style.display = 'block';
      resultEl.style.display = 'none';
      setStatus('没有找到结果');
      showError(msg || '查询失败，请换个词试试');
    };

    if (isChinese(q)) {
      youdaoSuggest(q).then(function (entries) {
        // 收集所有候选英文词（模糊备选：识别成"绘画"时，用户可点选其他候选）
        var cands = [];
        for (var i = 0; i < entries.length; i++) {
          var e = entries[i].explain;
          if (typeof e === 'string' && /[a-zA-Z]/.test(e)) {
            var words = e.trim().split(/[;\s,，]+/);
            for (var w = 0; w < words.length; w++) {
              var wt = words[w].trim().toLowerCase();
              if (/^[a-zA-Z][a-zA-Z'-]*$/.test(wt) && cands.indexOf(wt) < 0) cands.push(wt);
            }
          }
        }
        if (!cands.length) { fail('没有找到该词对应的英文'); return; }
        var en = cands[0];
        youdaoSuggest(en).then(function (enEntries) {
          var meaning = '';
          if (enEntries && enEntries.length) meaning = enEntries[0].explain || '';
          finish({ query: q, lang: 'zh', word: en, meaning: meaning, spelling: en.split(''), candidates: cands });
        }).catch(function () {
          finish({ query: q, lang: 'zh', word: en, meaning: '', spelling: en.split(''), candidates: cands });
        });
      }).catch(function () { fail('网络异常，请检查网络后重试'); });
    } else {
      youdaoSuggest(q).then(function (entries) {
        if (!entries || !entries.length) { fail('没有找到该单词'); return; }
        var en = entries[0].entry;
        var meaning = entries[0].explain || '';
        var cands = [];
        for (var i = 0; i < entries.length; i++) {
          var et = entries[i].entry;
          if (et && cands.indexOf(et) < 0) cands.push(et);
        }
        finish({ query: q, lang: 'en', word: en, meaning: meaning, spelling: en.split(''), candidates: cands });
      }).catch(function () { fail('网络异常，请检查网络后重试'); });
    }
  }

  // ---------- 语音识别（点击开始/停止） ----------
  function currentLang() {
    return langMode === 'en' ? 'en-US' : 'zh-CN';
  }

  function resetMicUI() {
    recognizing = false;
    lastMicEnd = Date.now();
    micBtn.classList.remove('recording');
    micText.textContent = '开始听';
    micIcon.textContent = '🎤';
    pulseRing.classList.remove('anim');
    if (!currentResult) setStatus('点一下开始听，再点一下识别');
  }

  function createRecog(lang) {
    var r = new SpeechRecognition();
    r.lang = lang;
    r.interimResults = true;
    r.continuous = false;
    r.maxAlternatives = 3;
    r._started = false;
    r.onstart = function () {
      r._started = true;
    };
    r.onresult = function (ev) {
      var interim = '', final = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var tr = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) final += tr;
        else interim += tr;
      }
      if (interim) {
        setStatus('正在听：' + interim);
      }
      if (final) {
        setStatus('识别到：' + final);
        doQuery(final);
      }
    };
    r.onerror = function (ev) {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        resetMicUI();
        setStatus('麦克风不可用');
        showError('无法使用麦克风（可能被浏览器禁止），已切换到键盘输入模式');
        inputMode.classList.add('show');
        modeSwitch.style.display = 'none';
      } else if (ev.error === 'no-speech') {
        resetMicUI();
        setStatus('没有听到声音，请点一下再试');
      } else if (ev.error === 'aborted') {
        resetMicUI();
      } else {
        // 非权限类错误：自动重试一次（如网络/音频通道冲突导致的偶发失败）
        if (!r._retried) {
          r._retried = true;
          resetMicUI();
          setStatus('识别未响应，正在重试…');
          setTimeout(function () { startRecog(); }, 700);
        } else {
          resetMicUI();
          setStatus('识别出错：' + ev.error + '，请再点一次');
        }
      }
    };
    r.onend = function () {
      resetMicUI();
    };
    return r;
  }

  function startRecog() {
    if (!useVoice) return;
    if (recognizing) return;
    // 关键：iOS 要求语音识别必须在用户点击手势内同步启动，
    // 任何 setTimeout 延迟都会让 start() 脱离手势上下文而被系统拒绝（表现为“点了没反应/说了话也说没识别到”）。
    // 因此这里全部同步执行：先停音频（同步）、abort 旧会话（同步）、立即 start()。
    clearSpell();
    stopAllAudio();
    unlockAutoplay();
    // 终止可能残留的旧识别会话
    if (recog) {
      try { recog.abort(); } catch (e) { /* ignore */ }
      recog = null;
    }
    recognizing = true;
    recogLang = currentLang();
    recog = createRecog(recogLang);
    micBtn.classList.add('recording');
    micIcon.textContent = '🎙️';
    micText.textContent = '正在听…';
    pulseRing.classList.add('anim');
    setStatus('正在听，请说出' + (recogLang === 'en' ? '英文单词' : '中文或英文') + '…');
    // 启动确认：2.5 秒后若识别器未真正启动（无 onstart 也无错误），复位提示
    recog._bootTimer = setTimeout(function () {
      if (recognizing && recog && !recog._started && !recog._retried) {
        recog._retried = true;
        try { recog.abort(); } catch (e) { /* ignore */ }
        resetMicUI();
        setStatus('识别没有响应，请再点一次');
      }
    }, 2500);
    // 超时自检：8 秒没有任何识别事件则自动停止，避免识别器卡死
    var idleTimer = setTimeout(function () {
      if (recognizing) {
        try { recog.stop(); } catch (e) { /* ignore */ }
        setStatus('没有识别到声音，已停止，请再点一次');
        resetMicUI();
      }
    }, 8000);
    recog._idleTimer = idleTimer;
    try {
      recog.start();
    } catch (e) {
      clearTimeout(recog._bootTimer);
      clearTimeout(recog._idleTimer);
      resetMicUI();
      setStatus('识别启动失败，请再点一次');
    }
  }

  function stopRecog() {
    if (!useVoice || !recognizing) return;
    // 再次点击：手势内解锁自动播放，立即复位界面，并停止识别触发结果
    unlockAutoplay();
    if (recog && recog._idleTimer) clearTimeout(recog._idleTimer);
    if (recog && recog._bootTimer) clearTimeout(recog._bootTimer);
    resetMicUI();
    try { recog.stop(); } catch (e) { /* ignore */ }
  }

  function switchTo(lang) {
    if (recogLang === lang) return;
    recogLang = lang;
    try { recog.stop(); } catch (e) { /* ignore */ }
    recognizing = false;
    setTimeout(function () {
      if (!recognizing) {
        recognizing = true;
        recog = createRecog(lang);
        try { recog.start(); } catch (e) { recognizing = false; }
      }
    }, 150);
  }

  // ---------- 按钮事件：点一下开始听，再点一下开始识别 ----------
  function toggleRecog() {
    if (recognizing) stopRecog();
    else startRecog();
  }
  micBtn.addEventListener('click', toggleRecog);

  // 语言切换
  var langBtns = document.querySelectorAll('#langSwitch button');
  langBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      langMode = btn.getAttribute('data-lang');
      langBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      if (langMode === 'en') setStatus('English 模式：点一下开始听，再说英文');
      else setStatus('中文模式：点一下开始听，再说中文');
    });
  });

  // 点击单词 → 重复朗读单词（手势内解锁自动播放）
  wordEl.addEventListener('click', function () {
    if (currentResult) {
      unlockAutoplay();
      setStatus('重复朗读：' + currentResult.word);
      playYoudaoVoice(currentResult.word);
    }
  });

  // ---------- 输入模式切换 ----------
  var inputModeOn = false;
  modeSwitch.addEventListener('click', function () {
    inputModeOn = !inputModeOn;
    inputMode.classList.toggle('show', inputModeOn);
    modeSwitch.textContent = inputModeOn ? '← 返回点击说话' : '麦克风不可用？点这里用键盘输入';
  });
  textBtn.addEventListener('click', function () { doQuery(textInput.value); });
  textInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doQuery(textInput.value);
  });

  if (!useVoice) {
    setStatus('当前浏览器不支持语音识别，请用键盘输入');
    inputMode.classList.add('show');
    modeSwitch.style.display = 'none';
  }
})();
</script>
</body>
</html>

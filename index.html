<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>语音英语查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #7cc6fe 0%, #a8e6ff 35%, #fff3b0 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .container {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 28px;
    position: relative;
  }
  /* 顶部标题 */
  .header { text-align: center; margin-bottom: 18px; }
  .header h1 {
    font-size: 30px; font-weight: 800; color: #1a4d8f;
    letter-spacing: 2px;
  }
  .header p { font-size: 15px; color: #3c6fb0; margin-top: 6px; }

  /* 结果区 */
  .result-area {
    width: 100%;
    min-height: 180px;
    background: rgba(255,255,255,0.86);
    border-radius: 28px;
    box-shadow: 0 10px 30px rgba(31,98,168,0.18);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 26px 22px;
    margin-bottom: 26px;
    backdrop-filter: blur(6px);
  }
  .placeholder { color: #8fb4d8; font-size: 17px; text-align: center; line-height: 1.7; }
  .result { width: 100%; text-align: center; display: none; }
  .result .word {
    font-size: 68px; font-weight: 900; color: #0d3f74;
    letter-spacing: 2px; cursor: pointer; line-height: 1.15;
    word-break: break-all;
    text-decoration: underline; text-decoration-color: rgba(13,63,116,0.25);
    text-underline-offset: 8px;
  }
  .result .hint-tap { font-size: 13px; color: #6a95c0; margin-top: 4px; }
  .result .phonetic { font-size: 22px; color: #4d7cb2; margin-top: 10px; }
  .result .meaning {
    font-size: 17px; color: #33577e; margin-top: 14px; line-height: 1.6;
    max-height: 72px; overflow-y: auto;
  }
  .result .spell-row { margin-top: 14px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .result .spell-row .letter {
    width: 42px; height: 42px; line-height: 42px; text-align: center;
    background: #ffe9a3; color: #a05a00; border-radius: 12px;
    font-size: 22px; font-weight: 800;
  }
  .result .spell-row .letter.active { background: #ffb74d; color: #fff; transform: scale(1.15); }

  /* 圆形按钮 */
  .btn-wrap { position: relative; display: flex; justify-content: center; margin-bottom: 22px; }
  .pulse-ring {
    position: absolute; top: 50%; left: 50%;
    width: 190px; height: 190px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.7);
    transform: translate(-50%,-50%);
    opacity: 0; pointer-events: none;
  }
  .pulse-ring.anim { animation: pulse 1.2s ease-out infinite; }
  @keyframes pulse {
    0% { transform: translate(-50%,-50%) scale(0.9); opacity: 0.9; }
    100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; }
  }
  .mic-btn {
    width: 190px; height: 190px; border-radius: 50%;
    background: radial-gradient(circle at 30% 28%, #6fb7ff 0%, #3d8bfd 55%, #2260d8 100%);
    box-shadow: 0 14px 34px rgba(29,96,210,0.42), inset 0 -6px 12px rgba(0,30,90,0.28);
    border: none; cursor: pointer; outline: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; transition: transform 0.12s;
  }
  .mic-btn:active, .mic-btn.recording { transform: scale(0.94); }
  .mic-btn .mic-icon { font-size: 54px; line-height: 1; }
  .mic-btn .mic-text { font-size: 17px; font-weight: 700; margin-top: 10px; letter-spacing: 2px; }
  .mic-btn.recording { background: radial-gradient(circle at 30% 28%, #ff9d6f 0%, #ff6b3d 55%, #e0441f 100%); box-shadow: 0 14px 34px rgba(230,80,40,0.45); }

  /* 听写提示 */
  .status { min-height: 26px; font-size: 17px; color: #1a4d8f; font-weight: 600; margin-bottom: 12px; text-align: center; }

  /* 键盘输入（降级模式） */
  .input-mode { width: 100%; display: none; margin-bottom: 20px; }
  .input-mode.show { display: block; }
  .input-row { display: flex; gap: 10px; }
  .input-row input {
    flex: 1; height: 52px; border-radius: 16px; border: 2px solid #3d8bfd;
    background: #fff; padding: 0 16px; font-size: 18px; color: #123;
    outline: none;
  }
  .input-row button {
    height: 52px; padding: 0 22px; border-radius: 16px; border: none;
    background: #3d8bfd; color: #fff; font-size: 17px; font-weight: 700; cursor: pointer;
  }
  .mode-switch { font-size: 14px; color: #2a63a8; text-decoration: underline; cursor: pointer; margin-bottom: 18px; }

  /* 底部说明 */
  .footer { margin-top: auto; font-size: 13px; color: rgba(26,77,143,0.6); text-align: center; line-height: 1.6; }

  /* 错误提示 */
  .error-box {
    background: #ffe1d8; color: #c0392b; border-radius: 14px; padding: 12px 16px;
    font-size: 15px; margin-bottom: 14px; display: none; width: 100%;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔊 语音英语查询</h1>
    <p>按住按钮，说中文或英文</p>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result-area" id="resultArea">
    <div class="placeholder" id="placeholder">👇 按住下面的按钮<br>说出你想查的词语</div>
    <div class="result" id="result">
      <div class="word" id="word"></div>
      <div class="hint-tap">👆 点击单词 重复读拼写</div>
      <div class="phonetic" id="phonetic"></div>
      <div class="meaning" id="meaning"></div>
      <div class="spell-row" id="spellRow"></div>
    </div>
  </div>

  <div class="status" id="status">按住说话，松手查询</div>

  <div class="mode-switch" id="modeSwitch">麦克风不可用？点这里用键盘输入</div>

  <div class="input-mode" id="inputMode">
    <div class="input-row">
      <input id="textInput" type="text" placeholder="输入中文或英文单词" enterkeyhint="search">
      <button id="textBtn">查询</button>
    </div>
  </div>

  <div class="btn-wrap">
    <div class="pulse-ring" id="pulseRing"></div>
    <button class="mic-btn" id="micBtn">
      <span class="mic-icon" id="micIcon">🎤</span>
      <span class="mic-text" id="micText">按住说话</span>
    </button>
  </div>

  <div class="footer">词库来源：有道词典<br>首次使用请允许麦克风权限</div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var placeholder = $('placeholder'), resultEl = $('result');
  var wordEl = $('word'), phoneticEl = $('phonetic'), meaningEl = $('meaning'), spellRow = $('spellRow');
  var micBtn = $('micBtn'), micIcon = $('micIcon'), micText = $('micText');
  var statusEl = $('status'), pulseRing = $('pulseRing'), errorBox = $('errorBox');
  var modeSwitch = $('modeSwitch'), inputMode = $('inputMode'), textInput = $('textInput'), textBtn = $('textBtn');

  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var useVoice = !!SpeechRecognition;
  var currentResult = null;   // { word, phonetic, meaning, spelling, query, lang }
  var recognizing = false;
  var recog = null;
  var recogLang = 'zh-CN';
  var lastInterim = '';
  var speechSupported = 'speechSynthesis' in window;
  var jsonpSeq = 0;

  // ---------- 界面状态 ----------
  function showError(msg) {
    if (!msg) { errorBox.style.display = 'none'; return; }
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }
  function setStatus(t) { statusEl.textContent = t; }

  // ---------- 有道 suggest JSONP 查询（纯静态，无跨域问题） ----------
  // 返回 Promise<entries[]>：中→英 时 entries[i].explain 为英文翻译；
  // 英→中 时 entries[i].entry 为英文单词、explain 为中文释义。
  function youdaoSuggest(q) {
    return new Promise(function (resolve, reject) {
      var cb = 'ydcb_' + (++jsonpSeq);
      var script = document.createElement('script');
      var timer = setTimeout(function () {
        cleanup();
        reject(new Error('timeout'));
      }, 12000);
      function cleanup() {
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[cb] = function (data) {
        cleanup();
        var entries = (data && data.data && data.data.entries) || [];
        resolve(entries);
      };
      script.src = 'https://dict.youdao.com/suggest?num=5&doctype=json&q=' +
        encodeURIComponent(q) + '&callback=' + cb;
      script.onerror = function () {
        cleanup();
        reject(new Error('network'));
      };
      document.body.appendChild(script);
    });
  }

  // 有道单词发音（美音 mp3）
  function playYoudaoVoice(word) {
    var a = document.createElement('audio');
    a.src = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=2';
    a.play().catch(function () { /* 自动播放被拦时静默 */ });
  }

  // ---------- 语音合成（拼读） ----------
  function pickVoice(langPrefix) {
    if (!speechSupported) return null;
    var voices = window.speechSynthesis.getVoices();
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(langPrefix) === 0) return voices[i];
    }
    return null;
  }

  // 逐个字母高亮 + 朗读拼写
  function animateSpelling(word) {
    var letters = spellRow.children;
    var total = word.length;
    if (speechSupported) window.speechSynthesis.cancel();
    var speakLetter = function (ch, i) {
      setTimeout(function () {
        for (var k = 0; k < letters.length; k++) letters[k].classList.remove('active');
        if (letters[i]) letters[i].classList.add('active');
        if (speechSupported) {
          var u = new SpeechSynthesisUtterance(ch);
          u.lang = 'en-US';
          u.rate = 0.85;
          u.pitch = 1.15;
          var v = pickVoice('en');
          if (v) u.voice = v;
          window.speechSynthesis.speak(u);
        }
        if (i === total - 1) {
          setTimeout(function () {
            for (var k = 0; k < letters.length; k++) letters[k].classList.remove('active');
          }, 500);
        }
      }, i * 750);
    };
    for (var i = 0; i < total; i++) speakLetter(word[i], i);
  }

  // ---------- 渲染结果 ----------
  function renderResult(data) {
    currentResult = data;
    placeholder.style.display = 'none';
    resultEl.style.display = 'block';
    wordEl.textContent = data.word;
    phoneticEl.textContent = data.phonetic || '';
    meaningEl.textContent = data.meaning || '';
    spellRow.innerHTML = '';
    data.spelling.forEach(function (ch) {
      var d = document.createElement('div');
      d.className = 'letter';
      d.textContent = ch.toUpperCase();
      spellRow.appendChild(d);
    });
    showError('');
    setStatus('已找到：' + data.word + '，正在朗读…');
    // 完整播报：有道美音读单词 → 拼读
    playYoudaoVoice(data.word);
    setTimeout(function () { animateSpelling(data.word); }, data.word.length > 6 ? 1800 : 1400);
  }

  // ---------- 查询（中→英 / 英→中） ----------
  function isChinese(s) { return /[\u4e00-\u9fa5]/.test(s); }

  function doQuery(q) {
    q = (q || '').trim();
    if (!q) { setStatus('请输入要查询的词语'); return; }
    setStatus('正在查询：' + q + ' …');
    showError('');

    var finish = function (result) { renderResult(result); };
    var fail = function (msg) {
      placeholder.style.display = 'block';
      resultEl.style.display = 'none';
      setStatus('没有找到结果');
      showError(msg || '查询失败，请换个词试试');
    };

    if (isChinese(q)) {
      // 中→英：先拿英文翻译
      youdaoSuggest(q).then(function (entries) {
        var en = null;
        for (var i = 0; i < entries.length; i++) {
          var e = entries[i].explain;
          if (typeof e === 'string' && /^[a-zA-Z][a-zA-Z\s'-]*$/.test(e.trim())) {
            en = e.trim().split(/\s+/)[0].toLowerCase();
            break;
          }
        }
        if (!en) { fail('没有找到该词对应的英文'); return; }
        // 再用英文拿中文释义
        youdaoSuggest(en).then(function (enEntries) {
          var meaning = '';
          if (enEntries && enEntries.length) meaning = enEntries[0].explain || '';
          finish({ query: q, lang: 'zh', word: en, phonetic: '', meaning: meaning, spelling: en.split('') });
        }).catch(function () {
          finish({ query: q, lang: 'zh', word: en, phonetic: '', meaning: '', spelling: en.split('') });
        });
      }).catch(function () { fail('网络异常，请检查网络后重试'); });
    } else {
      // 英→中
      youdaoSuggest(q).then(function (entries) {
        if (!entries || !entries.length) { fail('没有找到该单词'); return; }
        var en = entries[0].entry;
        var meaning = entries[0].explain || '';
        finish({ query: q, lang: 'en', word: en, phonetic: '', meaning: meaning, spelling: en.split('') });
      }).catch(function () { fail('网络异常，请检查网络后重试'); });
    }
  }

  // ---------- 语音识别（按住说话） ----------
  function createRecog(lang) {
    var r = new SpeechRecognition();
    r.lang = lang;
    r.interimResults = true;
    r.continuous = false;
    r.maxAlternatives = 1;
    r.onresult = function (ev) {
      var interim = '', final = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var tr = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) final += tr;
        else interim += tr;
      }
      if (interim) {
        lastInterim = interim;
        setStatus('正在听：' + interim);
        if (recogLang === 'zh-CN' && !/[\u4e00-\u9fa5]/.test(interim) && /[a-zA-Z]/.test(interim)) {
          switchTo('en-US');
        } else if (recogLang === 'en-US' && /[\u4e00-\u9fa5]/.test(interim)) {
          switchTo('zh-CN');
        }
      }
      if (final) {
        setStatus('识别到：' + final);
        doQuery(final);
      }
    };
    r.onerror = function (ev) {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        recognizing = false;
        micBtn.classList.remove('recording');
        pulseRing.classList.remove('anim');
        setStatus('麦克风不可用');
        showError('无法使用麦克风（可能被浏览器禁止），已切换到键盘输入模式');
        inputMode.classList.add('show');
        modeSwitch.style.display = 'none';
      } else if (ev.error === 'no-speech') {
        setStatus('没有听到声音，请按住再说一次');
      } else if (ev.error === 'aborted') {
        // 正常松手取消
      } else {
        setStatus('识别出错：' + ev.error);
      }
    };
    r.onend = function () {
      recognizing = false;
      micBtn.classList.remove('recording');
      micText.textContent = '按住说话';
      micIcon.textContent = '🎤';
      pulseRing.classList.remove('anim');
      if (!currentResult) setStatus('按住说话，松手查询');
    };
    return r;
  }

  function startRecog() {
    if (!useVoice) return;
    if (recognizing) return;
    recognizing = true;
    recogLang = 'zh-CN';
    recog = createRecog('zh-CN');
    lastInterim = '';
    micBtn.classList.add('recording');
    micIcon.textContent = '🎙️';
    micText.textContent = '正在听…';
    pulseRing.classList.add('anim');
    setStatus('请说出中文或英文词语…');
    try { recog.start(); } catch (e) { recognizing = false; }
  }

  function stopRecog() {
    if (!useVoice || !recognizing) return;
    try { recog.stop(); } catch (e) { /* ignore */ }
  }

  function switchTo(lang) {
    if (recogLang === lang) return;
    recogLang = lang;
    try { recog.stop(); } catch (e) { /* ignore */ }
    recognizing = false;
    setTimeout(function () {
      if (!recognizing) {
        recognizing = true;
        recog = createRecog(lang);
        try { recog.start(); } catch (e) { recognizing = false; }
      }
    }, 150);
  }

  // ---------- 按钮事件：按下开始，松手结束 ----------
  function bindPress(el) {
    var press = false;
    el.addEventListener('touchstart', function (e) {
      e.preventDefault();
      press = true;
      startRecog();
    }, { passive: false });
    el.addEventListener('touchend', function (e) {
      e.preventDefault();
      if (press) { press = false; stopRecog(); }
    }, { passive: false });
    el.addEventListener('touchcancel', function () { if (press) { press = false; stopRecog(); } });
    el.addEventListener('mousedown', function (e) { e.preventDefault(); press = true; startRecog(); });
    el.addEventListener('mouseup', function () { if (press) { press = false; stopRecog(); } });
    el.addEventListener('mouseleave', function () { if (press) { press = false; stopRecog(); } });
  }
  bindPress(micBtn);

  // 点击单词 → 重复读拼写
  wordEl.addEventListener('click', function () {
    if (currentResult) {
      setStatus('重复朗读拼写：' + currentResult.word);
      animateSpelling(currentResult.word);
    }
  });

  // ---------- 输入模式切换 ----------
  var inputModeOn = false;
  modeSwitch.addEventListener('click', function () {
    inputModeOn = !inputModeOn;
    inputMode.classList.toggle('show', inputModeOn);
    modeSwitch.textContent = inputModeOn ? '← 返回按住说话' : '麦克风不可用？点这里用键盘输入';
  });
  textBtn.addEventListener('click', function () { doQuery(textInput.value); });
  textInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doQuery(textInput.value);
  });

  // 预加载语音
  if (speechSupported) {
    window.speechSynthesis.getVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = function () { window.speechSynthesis.getVoices(); };
    }
  }
  if (!useVoice) {
    setStatus('当前浏览器不支持语音识别，请用键盘输入');
    inputMode.classList.add('show');
    modeSwitch.style.display = 'none';
  }
})();
</script>
</body>
</html>
